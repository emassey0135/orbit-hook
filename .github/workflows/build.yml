# Builds, tests and checks every push and pull request. Pushes to main are published, signed with the release key,
# as the "dev" pre-release; a tag such as v1.2.3, which must match versionName in build.gradle, is published as a
# release, which is what setup downloads.
#
# The release key comes from the repository's secrets: RELEASE_KEYSTORE (the keystore, in base64) and
# RELEASE_KEYSTORE_PASSWORD. Pull requests from forks don't get them, and aren't published.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APK: satellite-hook.apk
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the number of commits is the version code

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Version
        run: |
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name=$(sed -n "s/.*versionName = '\([^']*\)'.*/\1/p" build.gradle)
            if [ "v$name" != "$GITHUB_REF_NAME" ]; then
              echo "::error::The tag $GITHUB_REF_NAME doesn't match versionName $name in build.gradle"
              exit 1
            fi
            echo "VERSION_SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "VERSION_SUFFIX=-dev.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Test and check
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Release key
        if: github.event_name == 'push'
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::The repository's RELEASE_KEYSTORE and RELEASE_KEYSTORE_PASSWORD secrets aren't set"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=release\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$PASSWORD" "$PASSWORD" > keystore.properties

      - name: Build
        run: ./gradlew assembleRelease -PversionCode="$VERSION_CODE" -PversionSuffix="$VERSION_SUFFIX"

      - name: Signing certificate and version file
        if: github.event_name == 'push'
        run: |
          cp build/outputs/apk/release/*-release.apk "$APK"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$APK" | grep SHA-256
          # The launcher reads this to tell whether the release is newer than what is installed, without downloading it.
          name=$(sed -n "s/.*versionName = '\([^']*\)'.*/\1/p" build.gradle)
          printf '{"versionCode": %s, "versionName": "%s"}\n' "$VERSION_CODE" "$name$VERSION_SUFFIX" > version.json
          cat version.json

      - name: Publish the dev build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev "$APK" version.json --prerelease --target "$GITHUB_SHA" --title "Development build" \
            --notes "Built from $GITHUB_SHA. Development builds aren't tested on the devices yet; setup installs releases."

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" version.json --title "$GITHUB_REF_NAME" --generate-notes

      - name: Keep the APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: build/outputs/apk/release/*.apk
